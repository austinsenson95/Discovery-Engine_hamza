<div class="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;">
  <div style="margin-bottom: 40px;">
    <img src="{{logo}}" alt="Discovery Engine" style="width: 120px; height: auto;" />
  </div>

  <div style="font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: #F05A28; margin-bottom: 16px;">
    Discovery Engine
  </div>

  <div class="accent-line" style="margin: 0 auto 24px;"></div>

  <h1 style="font-size: 32px; line-height: 1.2; margin-bottom: 12px; max-width: 420px;">
    {{nicheName}}
  </h1>

  <p style="font-size: 14px; color: #4A4A4A; margin-bottom: 48px;">
    Your Coaching Blueprint
  </p>

  <div style="margin-top: auto; padding-top: 40px;">
    <p style="font-size: 12px; color: #4A4A4A;">
      Generated on {{generationDate}}
    </p>
  </div>
</div>
